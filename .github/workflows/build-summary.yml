name: Build summary

on:
  push:
    paths:
      - "20[0-9][0-9]/**/*.md"
      - "scripts/build.py"
      - "README.base.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build README and profile feed
        run: python scripts/build.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md public/profile-feed.json
          git diff --cached --quiet || git commit -m "docs: rebuild summary"
          git push